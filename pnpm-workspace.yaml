# 비어 있는 게 아니라 false다. 이 구분이 이 파일에서 유일하게 중요한 지점이다.
#
# `prepare` 스크립트인 `vp config`가 설치할 때마다 이 키를 다시 쓴다. 답이 없으면
# `esbuild: set this to true or false`라는 자리표시자를 심고, pnpm 11은 승인도
# 명시적 거부도 없는 빌드 스크립트를 만나면 exit 1로 죽는다. 즉 이 키를 비워두면
# `pnpm install`이 실패하고 CI는 검사 하나 돌기 전에 끝난다.
#
# false가 안전하다는 것은 가정이 아니라 확인된 사실이다. package.json의 모든
# 스크립트가 타고 도는 `remix/node-tsx`는 oxc-transform으로 트랜스파일하고,
# `vp check`는 oxfmt·oxlint·tsc다. 저장소 안에서 `remix/test`나 esbuild를 import하는
# 곳은 없다. esbuild는 @remix-run/cli와 vite의 전이 의존으로 딸려올 뿐이다.
# 게다가 빌드 스크립트를 건너뛰어도 esbuild 자체는 동작한다 - pnpm이
# @esbuild/<platform>을 실제 의존으로 설치하고 바이너리가 그 안에 들어 있어서,
# 건너뛴 postinstall은 npm 설치 경로용 링커일 뿐이다.
allowBuilds:
  esbuild: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
minimumReleaseAgeExclude:
  - '@remix-run/assets@0.5.0'
  - '@remix-run/async-context-middleware@0.3.5'
  - '@remix-run/auth-middleware@0.2.5'
  - '@remix-run/auth@0.2.7'
  - '@remix-run/cli@0.4.0'
  - '@remix-run/compression-middleware@0.1.13'
  - '@remix-run/cookie@0.6.0'
  - '@remix-run/cop-middleware@0.1.8'
  - '@remix-run/cors-middleware@0.1.8'
  - '@remix-run/csrf-middleware@0.1.8'
  - '@remix-run/data-table-mysql@0.5.0'
  - '@remix-run/data-table-postgres@0.5.0'
  - '@remix-run/data-table-sqlite@0.6.0'
  - '@remix-run/data-table@0.4.0'
  - '@remix-run/fetch-proxy@0.8.5'
  - '@remix-run/fetch-router@0.21.0'
  - '@remix-run/form-data-middleware@0.3.5'
  - '@remix-run/form-data-parser@0.17.5'
  - '@remix-run/logger-middleware@0.3.5'
  - '@remix-run/method-override-middleware@0.1.13'
  - '@remix-run/multipart-parser@0.16.4'
  - '@remix-run/node-fetch-server@0.14.1'
  - '@remix-run/node-hmr@0.1.0'
  - '@remix-run/render-middleware@0.1.5'
  - '@remix-run/response@0.3.8'
  - '@remix-run/route-pattern@0.24.0'
  - '@remix-run/session-middleware@0.4.0'
  - '@remix-run/test@0.6.0'
  - '@remix-run/ui-hmr@0.1.0'
  - '@remix-run/ui@0.5.0'
  - remix@3.0.0-beta.6
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  # remix@3.0.0-beta.6은 미들웨어 전부를 @remix-run/fetch-router ^0.21.0으로 올렸는데
  # @remix-run/static-middleware@0.4.13만 ^0.20.1에 남아 있다. pnpm이 두 벌을 깔면 두
  # `Middleware` 타입이 서로 다른 것이 되고, `createRouter({ middleware: [staticFiles(...)] })`가
  # "Type 'Middleware' is not assignable to type 'AnyMiddleware'"로 죽는다. 상류 릴리스의
  # 누락이므로 한 벌로 고정한다. static-middleware가 0.21로 올라오면 지울 것.
  '@remix-run/fetch-router': 0.21.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# 비어 있는 게 아니라 false다. 이 구분이 이 파일에서 유일하게 중요한 지점이다.
#
# `prepare` 스크립트인 `vp config`가 설치할 때마다 이 키를 다시 쓴다. 답이 없으면
# `esbuild: set this to true or false`라는 자리표시자를 심고, pnpm 11은 승인도
# 명시적 거부도 없는 빌드 스크립트를 만나면 exit 1로 죽는다. 즉 이 키를 비워두면
# `pnpm install`이 실패하고 CI는 검사 하나 돌기 전에 끝난다.
#
# 빌드 스크립트를 건너뛰어도 esbuild 자체는 동작한다 - pnpm이 @esbuild/<platform>을
# 실제 의존으로 설치하고 바이너리가 그 안에 들어 있어서, 건너뛴 postinstall은 npm 설치
# 경로용 링커일 뿐이다. Vite와 vite-node가 esbuild를 타고 도는데도 이 값이 false로
# 남아 있는 이유가 그것이다.
allowBuilds:
  esbuild: false
# `vite`는 진짜 Vite다. 예전에는 여기 catalog와 overrides가 있어서 모든 `vite` 요구를
# Vite+의 rolldown 포크(@voidzero-dev/vite-plus-core)로 갈아끼웠다. ADR 0010이 빌드를
# 순수 Vite로 되돌리면서 그 갈아끼우기를 걷어냈다 - TanStack Start가 peer로 요구하는
# `vite >= 7`이 실제로 설치된 그것이어야 하기 때문이다. Vite+는 `vp check`(포맷·린트·
# 타입 검사)로만 남고, 그 셋 중 어느 것도 Vite를 거치지 않는다.
catalog:
  vite-plus: latest

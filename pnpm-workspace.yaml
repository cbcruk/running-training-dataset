catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# allowBuilds는 비어 있다. pnpm이 기본으로 막는 postinstall 중 이 저장소가 실제로 필요한
# 것이 없다 - remix가 끌고 오는 esbuild가 하나 있지만 그 바이너리를 부르는 코드가 없어서
# (빌드는 Remix의 컴파일러가, 검사는 oxc가 한다) 무시된 채로 두 파이프라인이 모두 통과한다.
